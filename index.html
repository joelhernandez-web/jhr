<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPIs de Finanzas</title>
  <style>
    :root {
      color-scheme: light;
      --color-bg: #f5f6f8;
      --color-surface: #ffffff;
      --color-text: #1a1d23;
      --color-text-muted: #5b6270;
      --color-primary: #1f4b99;
      --color-border: #e1e4e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    header {
      background: var(--color-primary);
      color: #ffffff;
      padding: 2rem 1.25rem;
      text-align: center;
    }

    header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      line-height: 1.3;
    }

    header p {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.9;
      max-width: 40rem;
      margin-left: auto;
      margin-right: auto;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .form-placeholder {
      background: var(--color-surface);
      border: 2px dashed var(--color-border);
      border-radius: 12px;
      padding: 2.5rem 1.25rem;
      text-align: center;
      color: var(--color-text-muted);
    }

    .form-placeholder h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
      color: var(--color-text);
    }

    .form-placeholder p {
      margin: 0;
      font-size: 0.9rem;
    }

    @media (min-width: 640px) {
      header h1 {
        font-size: 2rem;
      }

      header p {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>KPIs de Finanzas</h1>
    <p>Seguimiento mensual de los indicadores clave de desempeño del área de Finanzas.</p>
  </header>

  <main>
    <section class="form-placeholder" id="formulario-kpis">
      <h2>Formulario de captura</h2>
      <p>Próximamente aquí se podrán registrar los KPIs de cada mes.</p>
    </section>
  </main>
</body>
</html>
